# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint. Nothing deploys until this repo is connected in the Render dashboard
# (New → Blueprint). Region, database name and Postgres version can't change after creation.

services:
  - type: web
    name: counter
    runtime: node
    region: oregon
    # Paid plans: free web services sleep after 15 min idle (MCP calls and webhooks would hit
    # cold starts) and free Postgres expires after 30 days, before judging ends Dec 15.
    plan: 0.5c-512mb
    branch: main
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && corepack pnpm build
    preDeployCommand: node scripts/migrate.ts
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: counter-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PLATFORM_MERCHANT_ID
        value: 9MGXZVWN9N9EE
      - key: PLATFORM_FEE_BPS
        value: "500"
      - key: RELEASE_AFTER_DAYS
        value: "14"
      - key: SESSION_SECRET
        generateValue: true
      # One-tap demo maker sign-in on /s/login for judges (BUILDOUT §10 #1).
      - key: DEMO_LOGIN
        value: "true"
      # Prompted once when the Blueprint is created.
      - key: PLATFORM_CLIENT_ID
        sync: false
      - key: PLATFORM_CLIENT_SECRET
        sync: false
      # Set after spike 11 creates the webhook; leave blank until then.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_CALL_CAP
        value: "300"
      # Listing pipeline runs as the counter-workflows task (BUILDOUT §6.2); inline if it can't start.
      - key: LISTING_RUNNER
        value: workflow
      - key: LISTING_WORKFLOW_SLUG
        value: counter-workflows/listingPipeline
      # Render API key for starting workflow runs (Account settings → API keys).
      - key: RENDER_API_KEY
        sync: false
      # Operator console /ops login (BUILDOUT §7.4).
      - key: OPS_PASSWORD
        sync: false
      # Read-only /ops login for judges (BUILDOUT §10 #8). Optional.
      - key: OPS_JUDGE_PASSWORD
        sync: false
      # AG Studio license for /s/dashboard (BUILDOUT §7.3). Unset = trial watermark.
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      # APP_BASE_URL defaults to RENDER_EXTERNAL_URL (lib/env.ts); set it only for a custom domain.

  # Every minute (BUILDOUT §6.3): checkout expiry, dead listing drafts, releases that are due, stuck
  # release retries, ship reminders. Workflows can't schedule or run past 24h, so timers live here.
  # Releases call PayPal, so this needs the PayPal vars too. Secrets are entered once in the
  # dashboard (same values as the web service).
  - type: cron
    name: counter-sweep
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    schedule: "* * * * *"
    branch: main
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile
    startCommand: node node_modules/tsx/dist/cli.mjs scripts/cron-sweep.ts
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: counter-db
          property: connectionString
      # Cron jobs don't get RENDER_EXTERNAL_URL.
      - key: APP_BASE_URL
        value: https://counter-2cdt.onrender.com
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PLATFORM_MERCHANT_ID
        value: 9MGXZVWN9N9EE
      - key: PLATFORM_FEE_BPS
        value: "500"
      - key: RELEASE_AFTER_DAYS
        value: "14"
      - key: PLATFORM_CLIENT_ID
        sync: false
      - key: PLATFORM_CLIENT_SECRET
        sync: false

  # Render Workflows (BUILDOUT §4.6). Tasks live in workflows/index.ts (listingPipeline, §6.2);
  # compute plans are set per task in code, so there's no plan field here.
  - type: workflow
    name: counter-workflows
    runtime: node
    region: oregon
    branch: main
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile
    startCommand: node node_modules/tsx/dist/cli.mjs workflows/index.ts
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: counter-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_CALL_CAP
        value: "300"

databases:
  - name: counter-db
    databaseName: counter
    user: counter
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    # No external connections. Add your IP in the dashboard when you need to seed or inspect.
    ipAllowList: []
